# Base de datos en memoria
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:cuentasdb;DB_CLOSE_DELAY=-1
quarkus.hibernate-orm.schema-management.strategy=drop-and-create

# REST Client hacia clientes-api (llamada interna, no pasa por el gateway)
quarkus.rest-client.clientes.url=http://clientes-api:8080
quarkus.rest-client.clientes.connect-timeout=2000
quarkus.rest-client.clientes.read-timeout=3000